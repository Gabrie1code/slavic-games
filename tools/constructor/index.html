<title>Конструктор фигурки</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Мастерская игрушек: слева верстак с ползунками, справа подиум с фигуркой. */
:root {
  --bg: #e7e9ef;
  --panel: #f6f7fa;
  --ink: #23262f;
  --muted: #6a7080;
  --line: #d3d7e0;
  --accent: #d6402f;
  --accent-ink: #ffffff;
  --stage: #cfd4de;
  --ok: #2f8a57;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171a21; --panel: #1f232c; --ink: #e8eaf0; --muted: #9aa1b2; --line: #333946;
    --accent: #f05a47; --accent-ink: #ffffff; --stage: #2a2f3a; --ok: #5cc28a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171a21; --panel: #1f232c; --ink: #e8eaf0; --muted: #9aa1b2; --line: #333946;
  --accent: #f05a47; --accent-ink: #ffffff; --stage: #2a2f3a; --ok: #5cc28a; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px; box-sizing: border-box;
}
.app { display: grid; grid-template-columns: minmax(290px, 370px) 1fr; gap: 16px; height: 100%; min-height: 600px; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
h1 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin: 0 0 4px; letter-spacing: 0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; line-height: 1.45; }
.controls { overflow-y: auto; padding: 6px 18px 18px; flex: 1; min-height: 0; }
details { border-bottom: 1px solid var(--line); padding: 10px 0; }
summary { cursor: pointer; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-weight: 600; }
details[open] summary::after { content: "−"; }
details.featured summary { color: var(--accent); }
summary:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; margin-top: 10px; align-items: center; }
.row label { font-weight: 600; }
.row output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 4.5em; text-align: right; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.note { color: var(--muted); font-size: 12px; line-height: 1.4; margin: 8px 0 0; }
.swlabel { font-weight: 600; margin-top: 12px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.stagewrap { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.stage { position: relative; flex: 1; min-height: 380px; background: var(--stage); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: 12px; bottom: 10px; right: 12px; color: var(--muted); font-size: 12px; pointer-events: none; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.poses { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px var(--font-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.bar { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.bar input[type=text] { flex: 1 1 180px; min-width: 0; font: 600 14px var(--font-body); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.btn { font: 700 14px var(--font-body); padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.5; cursor: default; }
.status { color: var(--muted); font-size: 13px; flex-basis: 100%; min-height: 1.2em; }
.status.ok { color: var(--ok); }
.saved { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; }
.saved .item { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.saved .item button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--font-body); padding: 6px 10px; cursor: pointer; }
.saved .item button.del { color: var(--muted); padding: 6px 9px; border-left: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { min-height: 440px; }
  .side { order: 2; }
}
</style>

<div class="app">
  <aside class="side">
    <header>
      <h1>Конструктор фигурки</h1>
      <p class="sub">Двигай ползунки — фигурка меняется сразу. Крути её мышкой или пальцем, колесо — приблизить.</p>
    </header>
    <div class="controls" id="controls"></div>
  </aside>
  <section class="stagewrap">
    <div class="stage" id="stage">
      <div class="poses" id="poses" role="group" aria-label="Поза"></div>
      <div class="hint"><span>Размеры — в сантиметрах игры</span><span id="modeNote"></span></div>
    </div>
    <div class="bar">
      <input type="text" id="name" maxlength="40" placeholder="Название варианта, например «Коренастый»" aria-label="Название варианта">
      <button class="btn primary" id="save">Сохранить</button>
      <button class="btn" id="copy">Копировать настройки</button>
      <button class="btn" id="reset">Сбросить</button>
      <div class="status" id="status" role="status"></div>
      <div class="saved" id="saved"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
// ======================= Параметры =======================
// [ключ, подпись, мин, макс, по умолчанию, единица]: "" — сантиметры, "%" — доля, "x" — множитель, "°" — градусы.
const GROUPS = [
  ["Соединения", [
    ["blend", "Гладкость соединений", 0, 1, 0.0, "%"],
    ["quality", "Подробность цельной сетки", 0, 1, 0.5, "%"],
  ], "featured", "0% — фигурка из отдельных деталей. Чем больше, тем сильнее детали сливаются; 100% — цельная, как отлитая из пластилина."],
  ["Голова", [
    ["headW", "Ширина", 0.30, 0.60, 0.46], ["headH", "Высота", 0.30, 0.60, 0.45],
    ["headD", "Глубина", 0.28, 0.55, 0.42], ["headRound", "Скругление углов", 0.05, 0.5, 0.32, "%"],
    ["headTaper", "Сужение к подбородку", 0.6, 1.0, 0.9, "%"], ["headScale", "Общий размер", 0.75, 1.3, 1.0, "x"],
    ["headForward", "Сдвиг вперёд", -0.06, 0.08, 0.0], ["headTilt", "Наклон вперёд", -20, 25, 0, "°"],
    ["headLift", "Посадка (выше / ниже)", -0.05, 0.08, 0.0],
  ]],
  ["Глаза", [
    ["eyeSize", "Размер", 0.5, 1.8, 1.0, "x"], ["eyeGap", "Расстояние между", 0.04, 0.16, 0.085],
    ["eyeY", "Высота на лице", 0.10, 0.36, 0.25], ["pupil", "Зрачок", 0.3, 0.9, 0.55, "%"],
    ["eyeTall", "Вытянутость вверх", 0.7, 1.8, 1.2, "x"], ["eyeTilt", "Наклон (грустные / злые)", -30, 30, 0, "°"],
    ["eyeBulge", "Выпуклость", 0.2, 1.0, 0.42, "%"], ["lookX", "Взгляд влево / вправо", -1, 1, 0, "%"],
    ["lookY", "Взгляд вверх / вниз", -1, 1, -0.15, "%"],
  ]],
  ["Шея и плечи", [
    ["neckLen", "Длина шеи", 0.0, 0.14, 0.05], ["neckR", "Толщина шеи", 0.04, 0.11, 0.062],
    ["shoulderW", "Ширина плеч", 0.15, 0.30, 0.205], ["shoulderDrop", "Опущенность плеч", 0.0, 0.10, 0.03],
    ["neckTilt", "Наклон шеи вперёд", -10, 30, 4, "°"], ["neckBase", "Ширина основания шеи", 1.0, 2.2, 1.4, "x"],
    ["shoulderBall", "Округлость плеча", 0.8, 1.6, 1.05, "x"], ["shoulderFwd", "Плечи вперёд / назад", -0.05, 0.05, 0.0],
  ]],
  ["Корпус", [
    ["torsoLen", "Длина", 0.32, 0.62, 0.47], ["chestW", "Ширина груди", 0.13, 0.28, 0.20],
    ["waistW", "Ширина талии", 0.12, 0.28, 0.176], ["hipW", "Ширина таза", 0.12, 0.28, 0.18],
    ["torsoDepth", "Толщина (спереди назад)", 0.45, 0.95, 0.68, "%"],
    ["belly", "Живот", 0, 1, 0.0, "%"], ["chestOut", "Грудь вперёд", 0, 1, 0.0, "%"],
    ["bottom", "Попа", 0, 1, 0.25, "%"], ["slouch", "Сутулость", -10, 25, 0, "°"],
    ["waistPos", "Высота талии", 0.2, 0.55, 0.35, "%"],
  ]],
  ["Руки", [
    ["upperArm", "Плечо (до локтя)", 0.12, 0.32, 0.20], ["forearm", "Предплечье", 0.12, 0.32, 0.20],
    ["armR", "Толщина", 0.035, 0.09, 0.062], ["handSize", "Кисть", 0.6, 1.6, 1.0, "x"],
    ["armTaper", "Сужение к кисти", 0.6, 1.1, 0.85, "%"], ["armSpread", "Отвести в стороны", -5, 30, 4, "°"],
    ["elbowRest", "Сгиб локтя в покое", 0, 45, 12, "°"], ["thumb", "Большой палец", 0.5, 1.6, 1.0, "x"],
    ["handFlat", "Ладонь плоская / круглая", 0.55, 1.1, 0.78, "%"],
  ]],
  ["Ноги", [
    ["thigh", "Бедро", 0.14, 0.38, 0.26], ["shin", "Голень", 0.12, 0.36, 0.23],
    ["legR", "Толщина", 0.045, 0.12, 0.08], ["legGap", "Расстояние между ногами", 0.06, 0.16, 0.092],
    ["legTaper", "Сужение к стопе", 0.6, 1.1, 0.85, "%"], ["knee", "Колени", 0.8, 1.4, 0.95, "x"],
    ["stance", "Стойка шире", -5, 15, 0, "°"], ["kneeRest", "Присогнутые колени", 0, 30, 0, "°"],
    ["thighTop", "Толщина верха бедра", 0.9, 1.5, 1.1, "x"],
  ]],
  ["Ботинки", [
    ["bootL", "Длина", 0.16, 0.38, 0.27], ["bootW", "Ширина", 0.10, 0.24, 0.16],
    ["bootH", "Высота", 0.07, 0.18, 0.13], ["bootFwd", "Носок вперёд", 0.0, 0.35, 0.18, "%"],
    ["bootToe", "Нос кверху", 0, 25, 6, "°"], ["sole", "Подошва", 0, 0.04, 0.015],
    ["bootRound", "Скруглённость", 0.4, 1.0, 1.0, "%"],
  ]],
];
const COLORS = ["#d6402f", "#2f6fd6", "#3b9a5a", "#e2b23a", "#8a55c9", "#e07a2e", "#2fa8b3", "#d4528f", "#5b6270"];
const BOOT_COLORS = ["same", "#3a2a22", "#20232a", "#e9e6df", "#7a4a2a", "#b23a2c", "#2b4d8c"];
const DEFAULTS = { color: COLORS[0], bootColor: "same", soleColor: "#2a2a2a" };
GROUPS.forEach(([, items]) => items.forEach(([k, , , , d]) => { DEFAULTS[k] = d; }));
let P = Object.assign({}, DEFAULTS);
try { const saved = JSON.parse(localStorage.getItem("figure-draft") || "null"); if (saved) P = Object.assign({}, DEFAULTS, saved); } catch (e) {}
const RAD = Math.PI / 180;

function fmt(v, unit) {
  if (unit === "%") return Math.round(v * 100) + "%";
  if (unit === "x") return "×" + v.toFixed(2);
  if (unit === "°") return Math.round(v) + "°";
  return (v * 100).toFixed(1) + " см";
}

// ======================= Панель =======================
const controls = document.getElementById("controls");
GROUPS.forEach(([title, items, cls, note], gi) => {
  const det = document.createElement("details");
  if (gi < 2) det.open = true;
  if (cls) det.className = cls;
  const sum = document.createElement("summary");
  sum.textContent = title;
  det.appendChild(sum);
  if (note) { const n = document.createElement("p"); n.className = "note"; n.textContent = note; det.appendChild(n); }
  items.forEach(([k, label, min, max, , unit]) => {
    const row = document.createElement("div");
    row.className = "row";
    const lab = document.createElement("label");
    lab.htmlFor = "p-" + k; lab.textContent = label;
    const out = document.createElement("output");
    out.id = "o-" + k;
    const inp = document.createElement("input");
    inp.type = "range"; inp.id = "p-" + k; inp.min = min; inp.max = max;
    inp.step = (max - min) / 200; inp.value = P[k];
    inp.addEventListener("input", () => { P[k] = parseFloat(inp.value); out.textContent = fmt(P[k], unit); rebuild(); draft(); });
    out.textContent = fmt(P[k], unit);
    row.append(lab, out, inp);
    det.appendChild(row);
  });
  controls.appendChild(det);
});
const colDet = document.createElement("details");
colDet.open = true;
colDet.innerHTML = "<summary>Цвет</summary>";
function swatchRow(label, list, key) {
  const l = document.createElement("div"); l.className = "swlabel"; l.textContent = label;
  const box = document.createElement("div");
  box.className = "swatches"; box.setAttribute("role", "group"); box.setAttribute("aria-label", label);
  list.forEach((c) => {
    const b = document.createElement("button");
    b.className = "swatch";
    b.dataset.value = c;
    if (c === "same") { b.style.background = "linear-gradient(135deg, var(--accent) 50%, var(--panel) 50%)"; b.setAttribute("aria-label", "Как тело"); b.title = "Как тело"; }
    else { b.style.background = c; b.setAttribute("aria-label", "Цвет " + c); }
    b.addEventListener("click", () => { P[key] = c; syncUI(); rebuild(); draft(); });
    box.appendChild(b);
  });
  colDet.append(l, box);
  return box;
}
const swBody = swatchRow("Тело", COLORS, "color");
const swBoot = swatchRow("Ботинки", BOOT_COLORS, "bootColor");
const swSole = swatchRow("Подошва", ["#2a2a2a", "#e9e6df", "#6b4a32", "#b23a2c"], "soleColor");
controls.appendChild(colDet);

function syncUI() {
  GROUPS.forEach(([, items]) => items.forEach(([k, , , , , unit]) => {
    document.getElementById("p-" + k).value = P[k];
    document.getElementById("o-" + k).textContent = fmt(P[k], unit);
  }));
  [[swBody, "color"], [swBoot, "bootColor"], [swSole, "soleColor"]].forEach(([box, key]) =>
    [...box.children].forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.value === P[key]))));
}
syncUI();
let draftTimer = 0;
function draft() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => { try { localStorage.setItem("figure-draft", JSON.stringify(P)); } catch (e) {} }, 300);
}

// ======================= Сцена =======================
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
camera.position.set(1.6, 1.25, 3.6);
const orbit = new THREE.OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.8, 0);
orbit.enableDamping = true; orbit.minDistance = 1.0; orbit.maxDistance = 7; orbit.enablePan = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(2.5, 4, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -1, near: 0.5, far: 12 });
scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.ShadowMaterial({ opacity: 0.22 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
scene.add(floor);
const ring = new THREE.Mesh(new THREE.RingGeometry(0.62, 0.66, 64),
  new THREE.MeshBasicMaterial({ color: 0x8a92a6, transparent: true, opacity: 0.35 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.001;
scene.add(ring);

const MAT = {
  body: new THREE.MeshStandardMaterial({ color: P.color, roughness: 0.55 }),
  boot: new THREE.MeshStandardMaterial({ color: P.color, roughness: 0.6 }),
  sole: new THREE.MeshStandardMaterial({ color: P.soleColor, roughness: 0.8 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.35 }),
  black: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 }),
  blended: new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55 }),
};

// ======================= Детали =======================
// Каждая деталь тела — «описание» (тип, сустав, положение в нём, размеры, материал). Из него
// строится и отдельная сетка, и формула расстояния для цельной (слитой) фигурки.
let figure = null, J = {}, PARTS = [], blendedMesh = null, dirty = true;

function group(parent, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g; }
function local(pos, rot) {
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(...(pos || [0, 0, 0])), new THREE.Quaternion().setFromEuler(new THREE.Euler(...(rot || [0, 0, 0]))), new THREE.Vector3(1, 1, 1));
  return m;
}
function part(joint, m, def) { const p = Object.assign({ joint, m, mat: "body" }, def); PARTS.push(p); return p; }

// Конус со скруглёнными концами вниз от начала: верх радиуса r0, низ (на глубине len) — r1.
function coneGeometry(len, r0, r1) {
  const pts = [];
  for (let i = 0; i <= 8; i++) { const a = -Math.PI / 2 + (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r1, -len + Math.sin(a) * r1)); }
  for (let i = 0; i <= 8; i++) { const a = (i / 8) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.cos(a) * r0, Math.sin(a) * r0)); }
  pts[0].x = 0.0001; pts[pts.length - 1].x = 0.0001;
  return new THREE.LatheGeometry(pts, 28);
}
function torsoProfile() {
  const L = P.torsoLen, W = P.waistPos;
  return [
    [0.0, -0.06], [P.hipW * 0.62, -0.05], [P.hipW * 0.92, -0.01], [P.hipW, 0.05],
    [P.waistW, L * W], [P.chestW * 0.97, L * 0.68], [P.chestW, L * 0.78],
    [Math.max(P.chestW * 0.9, P.shoulderW * 0.95), L * 0.86 - P.shoulderDrop * 0.6],
    [Math.max(P.neckR * P.neckBase, P.chestW * 0.55), L - 0.01], [P.neckR + 0.012, L + 0.005], [0.0, L + 0.012],
  ];
}
function headTaperAt(y, hy) { const t = Math.min(1, Math.max(0, (y + hy) / (2 * hy) * 1.6)); return P.headTaper + (1 - P.headTaper) * t; }

function makeMesh(p) {
  let g;
  if (p.type === "cone") g = coneGeometry(p.len, p.r0, p.r1);
  else if (p.type === "ell") { g = new THREE.SphereGeometry(1, 28, 18); g.scale(p.r[0], p.r[1], p.r[2]); }
  else if (p.type === "lathe") {
    g = new THREE.LatheGeometry(p.profile.map(([r, y]) => new THREE.Vector2(Math.max(0.0001, r), y)), 48);
    g.scale(1, 1, p.depth);
  } else if (p.type === "rbox") {
    const rr = Math.min(p.h[0], p.h[1], p.h[2]) * 2 * p.round;
    g = new THREE.RoundedBoxGeometry(p.h[0] * 2, p.h[1] * 2, p.h[2] * 2, 6, rr);
    const pos = g.attributes.position;

function rebuild() {

    const holder = group(head, s * P.eyeGap * hs, ey, fz - er * 0.1);
    holder.rotation.z = -s * P.eyeTilt * RAD;
    const w = new THREE.Mesh(new THREE.SphereGeometry(er, 24, 16), MAT.white);
    w.scale.set(0.85, 0.85 * P.eyeTall, P.eyeBulge);
    holder.add(w);
    const pr = er * P.pupil;
    const b = new THREE.Mesh(new THREE.SphereGeometry(pr, 20, 14), MAT.black);
    b.scale.set(0.85, 0.85 * P.eyeTall, 0.45);
    b.position.set(P.lookX * (er * 0.85 - pr * 0.85) * 0.9, P.lookY * (er * 0.85 * P.eyeTall - pr * 0.85 * P.eyeTall) * 0.9, er * P.eyeBulge * 0.92);
    holder.add(b);

  const shY = L * 0.82 - P.shoulderDrop;

    const r = P.armR, rw = r * P.armTaper;

    part(sh, local(), { type: "cone", len: P.upperArm, r0: r, r1: (r + rw) / 2 });
    const el = J["el" + side] = group(sh, 0, -P.upperArm, 0);
    part(el, local(), { type: "cone", len: P.forearm, r0: (r + rw) / 2 * 0.97, r1: rw });

    const k = P.handSize;
    part(hand, local([0, -0.05 * k, 0]), { type: "ell", r: [0.07 * k * P.handFlat, 0.07 * k * 1.05, 0.07 * k * 0.95] });
    part(hand, local([-s * 0.032 * k, -0.02 * k, 0.04 * k], [0.6, 0, -s * 0.35]),

    const r = P.legR, rb = r * P.legTaper;

    part(kn, local(), { type: "cone", len: P.shin - ankleY * 0.2, r0: (r + rb) / 2 * P.knee * 0.97, r1: rb });
    const an = J["an" + side] = group(kn, 0, -P.shin, 0);
    const toe = J["toe" + side] = group(an, 0, -ankleY + P.sole, P.bootL * P.bootFwd);
    toe.rotation.x = -P.bootToe * RAD * 0.5;
    const bh = P.bootH / 2;
    part(toe, local([0, bh, 0]), { type: "ell", r: [P.bootW / 2, bh, P.bootL / 2], mat: "boot", round: P.bootRound });
    if (P.sole > 0.002) part(toe, local([0, P.sole / 2 - 0.002, 0]),
      { type: "ell", r: [P.bootW / 2 * 1.04, P.sole, P.bootL / 2 * 1.03], mat: "sole" });
  });
  PARTS.forEach((p) => { if (p.type === "ell" && p.round && p.round < 1) p.r = [p.r[0], p.r[1] * (0.6 + 0.4 * p.round), p.r[2]]; makeMesh(p); });
  scene.add(figure);
  orbit.target.y = (hipY + L + P.neckLen + P.headH * hs) / 2;
  if (blendedMesh) { scene.remove(blendedMesh); blendedMesh.geometry.dispose(); blendedMesh = null; }
  dirty = true;
}

// ======================= Цельная фигурка (слияние деталей) =======================
// Каждая деталь даёт «расстояние до поверхности»; детали объединяются плавным минимумом (smin) —

function sdf(q, x, y, z) {

    if (!J[k]) return;
    const a = rest[k] || [0, 0, 0], b = p[k] || [0, 0, 0];
    J[k].rotation.set(a[0] + b[0], a[1] + b[1], a[2] + b[2]);
  });
  // Стопы ровно по земле, когда нога стоит.
  ["R", "L"].forEach((s) => { if (J["an" + s]) J["an" + s].rotation.set(-(J["hip" + s].rotation.x + J["kn" + s].rotation.x), 0, -J["hip" + s].rotation.z); });
  return !!p.anim;
}

function resize() {
  const w = stage.clientWidth, hgt = stage.clientHeight;
  renderer.setSize(w, hgt, false);
  camera.aspect = w / hgt; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock = new THREE.Clock();
const modeNote = document.getElementById("modeNote");
let lastBlend = 0;
function tick() {
  const t = still ? 0.4 : clock.getElapsedTime();
  const animated = applyPose(t);
  const blended = P.blend > 0.001;
  PARTS.forEach((p) => { p.mesh.visible = !blended; });
  if (blended) {
    const now = performance.now();
    // В движении цельная сетка пересчитывается ~12 раз в секунду (покрупнее), в покое — подробно.
    if (dirty || (animated && now - lastBlend > 80)) {
      const tris = buildBlended(animated);
      modeNote.textContent = "Цельная фигурка · " + tris.toLocaleString("ru-RU") + " треугольников";
      lastBlend = now; dirty = false;
    }
    if (blendedMesh) blendedMesh.visible = true;
  } else {
    if (blendedMesh) blendedMesh.visible = false;
    modeNote.textContent = "Отдельные детали";
  }
  orbit.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
rebuild(); resize(); tick();

// ======================= Сохранение =======================
const statusEl = document.getElementById("status");
const savedEl = document.getElementById("saved");
const nameEl = document.getElementById("name");
const saveBtn = document.getElementById("save");
function say(text, ok) { statusEl.textContent = text; statusEl.classList.toggle("ok", !!ok); }
function exportParams() {
  const out = { color: P.color, bootColor: P.bootColor, soleColor: P.soleColor };
  Object.keys(DEFAULTS).forEach((k) => { if (typeof P[k] === "number") out[k] = Math.round(P[k] * 1000) / 1000; });
  return out;
}
document.getElementById("copy").addEventListener("click", async () => {
  const text = JSON.stringify(exportParams(), null, 1);
  try { await navigator.clipboard.writeText(text); say("Настройки скопированы — можно вставить их в чат.", true); }
  catch (e) { nameEl.value = text; nameEl.select(); say("Копирование не сработало: настройки в поле названия, выдели и скопируй."); }
});
document.getElementById("reset").addEventListener("click", () => {
  P = Object.assign({}, DEFAULTS); syncUI(); rebuild(); draft(); say("Вернул исходные размеры.");
});

let db = null, presets = [];
function renderSaved() {
  savedEl.textContent = "";
  if (!presets.length) {
    const e = document.createElement("span");
    e.className = "empty";
    e.textContent = db ? "Сохранённых вариантов пока нет — придумай название и нажми «Сохранить»." : "";
    savedEl.appendChild(e);
    return;
  }
  presets.forEach((doc) => {
    const d = doc.data();
    const item = document.createElement("span");
    item.className = "item";
    const load = document.createElement("button");
    load.textContent = d.name || "Без названия";
    load.title = "Загрузить вариант";
    load.addEventListener("click", () => {
      P = Object.assign({}, DEFAULTS, d.params || {}); syncUI(); rebuild(); draft();
      nameEl.value = d.name || ""; say("Загружен вариант «" + (d.name || "Без названия") + "».", true);
    });
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "×"; del.setAttribute("aria-label", "Удалить «" + (d.name || "") + "»");
    del.addEventListener("click", async () => {
      if (del.dataset.armed !== "1") { del.dataset.armed = "1"; del.textContent = "удалить?"; return; }
      try { await db.collection("presets").doc(doc.id).delete(); say("Удалено."); } catch (e) { say("Не получилось удалить: " + (e.code || e.message)); }
    });
    item.append(load, del);
    savedEl.appendChild(item);
  });
}
saveBtn.addEventListener("click", async () => {
  const name = nameEl.value.trim() || "Вариант " + new Date().toLocaleString("ru-RU", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  if (!db) { say("Сохранение здесь недоступно — нажми «Копировать настройки» и пришли их в чат."); return; }
  saveBtn.disabled = true;
  try {
    const existing = presets.find((d) => (d.data().name || "") === name);
    const ref = existing ? db.collection("presets").doc(existing.id) : db.collection("presets").doc();
    await ref.set({ name, params: exportParams(), savedAt: new Date().toISOString() });
    say("Сохранено: «" + name + "». Напиши в чат, какой вариант брать — я его прочитаю.", true);
  } catch (e) {
    say(e.code === "invalid_argument" ? "У тебя нет прав сохранять здесь — нажми «Копировать настройки»." : "Не сохранилось (" + (e.code || e.message) + "). Попробуй ещё раз.");
  }
  saveBtn.disabled = false;
});

(async () => {
  try { db = window.claude && (await window.claude.use("db")); } catch (e) { db = null; }
  if (!db) { renderSaved(); say("Сохранение доступно, когда страница открыта в Claude. Пока можно скопировать настройки."); return; }
  let loaded = false;
  const timer = setTimeout(() => { if (!loaded) say("Сохранённые варианты пока не загрузились — проверь соединение."); }, 10000);
  db.collection("presets").orderBy("savedAt", "desc").onSnapshot((snap) => {
    presets = snap.docs;
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(timer); }
    renderSaved();
  }, (e) => { clearTimeout(timer); say("Список вариантов недоступен (" + e.code + ")."); });
  renderSaved();
})();
</script>
